name: Downgrade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Downgrade / Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Cache CondaPkg
        id: cache-condaPkg
        uses: actions/cache@v6
        env:
          cache-name: cache-condapkg
        with:
          path: .CondaPkg
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('docs/CondaPkg.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-
      - uses: julia-actions/julia-downgrade-compat@v2.7.0
        with:
          mode: deps
          projects: ".,test"
          skip: Random,Test
      # TODO: remove once DimensionalData v0.30.4 is released. The downgraded manifest keeps
      # the registered DimensionalData's tree hash, so its `[sources]` entry is not loaded.
      - name: Add DimensionalData from [sources]
        run: |
          using Pkg, TOML
          source = TOML.parsefile("Project.toml")["sources"]["DimensionalData"]
          spec = PackageSpec(; name="DimensionalData", url=source["url"], rev=source["rev"])
          Pkg.add(spec; preserve=Pkg.PRESERVE_ALL)
        shell: julia --color=yes --project=test/ {0}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: "test"
      - run: |
          import Pkg
          Pkg.develop(Pkg.PackageSpec(path=pwd()))
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
          include(joinpath(pwd(), "test", "runtests.jl"))
        shell: julia --color=yes --project=test/ --check-bounds=yes --depwarn=yes --code-coverage=@ {0}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
