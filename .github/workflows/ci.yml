name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["min", "lts", "1", "pre"]
        os: [ubuntu-latest]
        include:
          - julia-version: "1"
            os: macOS-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Cache CondaPkg
        id: cache-condaPkg
        uses: actions/cache@v6
        env:
          cache-name: cache-condapkg
        with:
          path: .CondaPkg
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('docs/CondaPkg.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-
      # Julia < v1.11 ignores `[sources]`, so add those packages explicitly
      - name: Add packages from [sources]
        run: |
          using Pkg, TOML
          VERSION < v"1.11" || exit()
          sources = get(TOML.parsefile("Project.toml"), "sources", Dict())
          for (name, source) in sources
              haskey(source, "url") || continue
              Pkg.add(PackageSpec(; name, url=source["url"], rev=get(source, "rev", nothing)))
          end
        shell: julia --color=yes --project=. {0}
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
        if: ${{ matrix.julia-version == '1' && matrix.os =='ubuntu-latest' }}
